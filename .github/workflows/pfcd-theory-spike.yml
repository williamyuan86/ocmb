name: PFCD theory spike

on:
  push:
    branches:
      - theory-spike-20260828
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build formal spike
        working-directory: formal_spike
        run: |
          lake update
          lake build
